<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArenaChain | Onchain Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --cyan: #00F0FF;
        --magenta: #FF00AA;
        --purple: #8B5CF6;
        --dark: #0A0A0F;
        --dark-2: #12121A;
        --dark-3: #1A1A25;
      }
      
      * {
        scrollbar-width: thin;
        scrollbar-color: var(--cyan) var(--dark-2);
      }
      
      body {
        font-family: 'Rajdhani', sans-serif;
        background: var(--dark);
        overflow-x: hidden;
      }
      
      .font-display {
        font-family: 'Orbitron', sans-serif;
      }
      
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      
      .grid-bg {
        background-image: 
          linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        background-position: center center;
      }
      
      .glow-cyan {
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), 0 0 40px rgba(0, 240, 255, 0.1);
      }
      
      .glow-magenta {
        box-shadow: 0 0 20px rgba(255, 0, 170, 0.3), 0 0 40px rgba(255, 0, 170, 0.1);
      }
      
      .glow-text-cyan {
        text-shadow: 0 0 10px rgba(0, 240, 255, 0.8), 0 0 30px rgba(0, 240, 255, 0.4);
      }
      
      .glow-text-magenta {
        text-shadow: 0 0 10px rgba(255, 0, 170, 0.8), 0 0 30px rgba(255, 0, 170, 0.4);
      }
      
      .card-glass {
        background: linear-gradient(135deg, rgba(26, 26, 37, 0.9) 0%, rgba(18, 18, 26, 0.95) 100%);
        border: 1px solid rgba(0, 240, 255, 0.1);
        backdrop-filter: blur(10px);
      }
      
      .card-glass:hover {
        border-color: rgba(0, 240, 255, 0.3);
      }
      
      .gradient-border {
        position: relative;
        background: linear-gradient(135deg, var(--dark-2), var(--dark-3));
      }
      
      .gradient-border::before {
        content: '';
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: inherit;
        background: linear-gradient(135deg, var(--cyan), var(--magenta));
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      
      .pulse-live {
        animation: pulse-live 2s ease-in-out infinite;
      }
      
      @keyframes pulse-live {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      
      .float {
        animation: float 3s ease-in-out infinite;
      }
      
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      
      .scan-line {
        position: relative;
        overflow: hidden;
      }
      
      .scan-line::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--cyan), transparent);
        animation: scan 3s linear infinite;
      }
      
      @keyframes scan {
        0% { top: 0; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }
      
      .stagger-1 { animation-delay: 0.1s; }
      .stagger-2 { animation-delay: 0.2s; }
      .stagger-3 { animation-delay: 0.3s; }
      .stagger-4 { animation-delay: 0.4s; }
      
      .fade-in {
        animation: fadeIn 0.6s ease-out forwards;
        opacity: 0;
      }
      
      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
      }
      
      .slide-up {
        animation: slideUp 0.6s ease-out forwards;
        opacity: 0;
        transform: translateY(20px);
      }
      
      @keyframes slideUp {
        to { opacity: 1; transform: translateY(0); }
      }
      
      .hover-lift {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      
      .hover-lift:hover {
        transform: translateY(-4px);
      }
      
      .btn-primary {
        background: linear-gradient(135deg, var(--cyan), #00D4E0);
        color: var(--dark);
        font-weight: 600;
        transition: all 0.3s ease;
      }
      
      .btn-primary:hover {
        box-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
        transform: translateY(-2px);
      }
      
      .btn-secondary {
        background: transparent;
        border: 1px solid var(--cyan);
        color: var(--cyan);
        transition: all 0.3s ease;
      }
      
      .btn-secondary:hover {
        background: rgba(0, 240, 255, 0.1);
        box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
      }
      
      .token-glow {
        background: linear-gradient(135deg, #FFD700, #FFA500);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
